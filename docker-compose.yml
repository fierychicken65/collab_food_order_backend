services:
  postgres:
    image: postgres:16-alpine
    container_name: collab_food_order_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collab_food_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_food_order"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
